name: probe-tosc

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe.mjs'
      - '.github/workflows/probe.yml'

permissions:
  contents: write

concurrency:
  group: probe-tosc
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'

      - name: Install playwright (best effort)
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright-core@1.47.2 --no-audit --no-fund || true
          npm i playwright@1.47.2 --no-audit --no-fund || true
          npx playwright install --with-deps chromium || true

      - name: Probe tosc.it
        continue-on-error: true
        run: node probe.mjs

      - name: Commit probe.json
        if: always()
        continue-on-error: true
        run: |
          git config user.name "gaga-bot"
          git config user.email "gaga-bot@users.noreply.github.com"
          git add probe.json
          if git diff --cached --quiet; then
            echo "no probe.json change"
          else
            git commit -m "probe: $(date -u +%FT%TZ)"
            git push
          fi
